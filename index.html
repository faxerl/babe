<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAXERL</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f3ed;
      color: #302d2b;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .faxerl {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .names {
      font-size: 16px;
      margin-bottom: 18px;
      opacity: 0.75;
    }

    .kaomoji {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .paper {
      width: 100%;
      background: white;
      border: 2px solid #302d2b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 4px 4px 0 #302d2b;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 360px;
      touch-action: none;
      cursor: crosshair;
    }

    .text-input {
      position: absolute;
      display: none;
      border: 2px dashed #302d2b;
      background: rgba(255,255,255,0.95);
      color: #302d2b;
      outline: none;
      padding: 3px 5px;
      min-width: 120px;
      max-width: 90%;
      z-index: 5;
    }

    .tools {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
    }

    .tools button,
    .tools select {
      border: 2px solid #302d2b;
      background: white;
      color: #302d2b;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #302d2b;
    }

    .tools button.active {
      background: #302d2b;
      color: white;
    }

    .tools select {
      max-width: 135px;
    }

    .size-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: currentColor;
      border-radius: 50%;
      vertical-align: middle;
    }

    .size-dot.medium {
      width: 9px;
      height: 9px;
    }

    .size-dot.large {
      width: 14px;
      height: 14px;
    }

    .size-dot.xlarge {
      width: 19px;
      height: 19px;
    }

    .size-dot.xxlarge {
      width: 25px;
      height: 25px;
    }

    .photo-tools {
      display: none;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .photo-tools button {
      border: 2px solid #302d2b;
      background: white;
      color: #302d2b;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #302d2b;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      border: 2px solid #302d2b;
      background: white;
      color: #302d2b;
      border-radius: 6px;
      padding: 12px 22px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #302d2b;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #302d2b;
    }

    #sendMessage {
      display: none;
      margin-top: 20px;
      font-size: 25px;
    }

    #photoInput {
      display: none;
    }
  </style>
</head>

<body>

  <main class="faxerl">

    <h1>FAXERL</h1>

    <div class="names">Zoë ↔ Manu</div>

    <div class="kaomoji">❤ (ɔˆз(ˆ⌣ˆc)</div>

    <div class="paper">
      <canvas id="canvas"></canvas>

      <input
        id="textInput"
        class="text-input"
        type="text"
        autocomplete="off"
        placeholder="Text..."
      >
    </div>

    <div class="tools">

      <button id="brushButton" class="active">
        ✎
      </button>

      <button class="sizeButton active" data-size="2">
        <span class="size-dot"></span>
      </button>

      <button class="sizeButton" data-size="4">
        <span class="size-dot medium"></span>
      </button>

      <button class="sizeButton" data-size="7">
        <span class="size-dot large"></span>
      </button>

      <button class="sizeButton" data-size="12">
        <span class="size-dot xlarge"></span>
      </button>

      <button class="sizeButton" data-size="20">
        <span class="size-dot xxlarge"></span>
      </button>

      <button id="textButton">
        T
      </button>

      <button id="boldButton">
        B
      </button>

      <select id="fontSelect">
        <option value="Arial">Arial</option>
        <option value="Courier New">Courier New</option>
        <option value="Comic Sans MS">Comic Sans MS</option>
        <option value="Bangers">Comic</option>
      </select>

      <select id="fontSizeSelect">
        <option value="16">16</option>
        <option value="20" selected>20</option>
        <option value="26">26</option>
        <option value="34">34</option>
      </select>

      <button id="photoButton">
        📷
      </button>

    </div>

    <div class="photo-tools" id="photoTools">

      <button id="originalButton">
        Original
      </button>

      <button id="drawingButton">
        ✏️ Zeichnung
      </button>

      <button id="removePhotoButton">
        Foto löschen
      </button>

    </div>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
    >

    <div class="buttons">
      <button id="clearButton">löschen</button>
      <button id="sendButton">senden</button>
    </div>

    <div id="sendMessage">
      ٩(◕‿◕｡)۶
    </div>

  </main>

  <script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const textInput = document.getElementById("textInput");
    const photoInput = document.getElementById("photoInput");
    const photoTools = document.getElementById("photoTools");

    let drawing = false;
    let textMode = false;

    let textX = 0;
    let textY = 0;

    let brushSize = 2;
    let boldText = false;

    let selectedFont = "Arial";
    let selectedFontSize = 20;

    let originalPhoto = null;
    let currentPhoto = null;


    // --------------------------------------------------
    // CANVAS
    // --------------------------------------------------

    function resizeCanvas() {

      const rect = canvas.getBoundingClientRect();

      const oldCanvas = document.createElement("canvas");

      oldCanvas.width = canvas.width;
      oldCanvas.height = canvas.height;

      if (canvas.width && canvas.height) {
        oldCanvas
          .getContext("2d")
          .drawImage(canvas, 0, 0);
      }

      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = "white";
      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      if (oldCanvas.width && oldCanvas.height) {

        ctx.drawImage(
          oldCanvas,
          0,
          0,
          oldCanvas.width,
          oldCanvas.height,
          0,
          0,
          canvas.width,
          canvas.height
        );

      }

      setupBrush();
    }


    function setupBrush() {

      ctx.strokeStyle = "#302d2b";
      ctx.lineWidth = brushSize;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

    }


    resizeCanvas();

    window.addEventListener(
      "resize",
      resizeCanvas
    );


    function getPosition(event) {

      const rect =
        canvas.getBoundingClientRect();

      return {

        x: event.clientX - rect.left,

        y: event.clientY - rect.top

      };

    }


    // --------------------------------------------------
    // DRAWING
    // --------------------------------------------------

    canvas.addEventListener(
      "pointerdown",
      (event) => {

        if (textMode) {

          const position =
            getPosition(event);

          textX = position.x;
          textY = position.y;

          textInput.style.left =
            textX + "px";

          textInput.style.top =
            textY + "px";

          textInput.style.display =
            "block";

          updateTextInput();

          textInput.value = "";

          textInput.focus();

          return;
        }


        drawing = true;

        const position =
          getPosition(event);

        ctx.beginPath();

        ctx.moveTo(
          position.x,
          position.y
        );

        canvas.setPointerCapture(
          event.pointerId
        );

      }
    );


    canvas.addEventListener(
      "pointermove",
      (event) => {

        if (!drawing || textMode) {
          return;
        }

        const position =
          getPosition(event);

        ctx.lineTo(
          position.x,
          position.y
        );

        ctx.stroke();

      }
    );


    canvas.addEventListener(
      "pointerup",
      () => {

        drawing = false;

        ctx.closePath();

      }
    );


    canvas.addEventListener(
      "pointercancel",
      () => {

        drawing = false;

        ctx.closePath();

      }
    );


    // --------------------------------------------------
    // BRUSH
    // --------------------------------------------------

    document
      .getElementById("brushButton")
      .addEventListener(
        "click",
        () => {

          textMode = false;

          document
            .getElementById("brushButton")
            .classList.add("active");

          document
            .getElementById("textButton")
            .classList.remove("active");

          textInput.style.display =
            "none";

          canvas.style.cursor =
            "crosshair";

        }
      );


    document
      .querySelectorAll(".sizeButton")
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(".sizeButton")
                .forEach(
                  b =>
                    b.classList.remove(
                      "active"
                    )
                );

              button.classList.add(
                "active"
              );

              brushSize =
                Number(
                  button.dataset.size
                );

              setupBrush();

              textMode = false;

              document
                .getElementById("brushButton")
                .classList.add("active");

              document
                .getElementById("textButton")
                .classList.remove("active");

              textInput.style.display =
                "none";

              canvas.style.cursor =
                "crosshair";

            }
          );

        }
      );


    // --------------------------------------------------
    // TEXT
    // --------------------------------------------------

    document
      .getElementById("textButton")
      .addEventListener(
        "click",
        () => {

          textMode = true;

          document
            .getElementById("textButton")
            .classList.add("active");

          document
            .getElementById("brushButton")
            .classList.remove("active");

          canvas.style.cursor =
            "text";

        }
      );


    document
      .getElementById("boldButton")
      .addEventListener(
        "click",
        () => {

          boldText = !boldText;

          document
            .getElementById("boldButton")
            .classList.toggle(
              "active",
              boldText
            );

          updateTextInput();

        }
      );


    document
      .getElementById("fontSelect")
      .addEventListener(
        "change",
        event => {

          selectedFont =
            event.target.value;

          updateTextInput();

        }
      );


    document
      .getElementById("fontSizeSelect")
      .addEventListener(
        "change",
        event => {

          selectedFontSize =
            Number(event.target.value);

          updateTextInput();

        }
      );


    function updateTextInput() {

      textInput.style.fontFamily =
        selectedFont;

      textInput.style.fontSize =
        selectedFontSize + "px";

      textInput.style.fontWeight =
        boldText
          ? "bold"
          : "normal";

    }


    textInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          commitText();

        }

        if (event.key === "Escape") {

          textInput.style.display =
            "none";

          textInput.value = "";

        }

      }
    );


    function commitText() {

      const text =
        textInput.value.trim();

      if (!text) {

        textInput.style.display =
          "none";

        return;

      }

      const weight =
        boldText
          ? "bold"
          : "normal";

      ctx.fillStyle =
        "#302d2b";

      ctx.font =
        weight +
        " " +
        selectedFontSize +
        "px " +
        '"' +
        selectedFont +
        '"';

      ctx.textBaseline =
        "top";

      ctx.fillText(
        text,
        textX,
        textY
      );

      textInput.style.display =
        "none";

      textInput.value = "";

    }


    // --------------------------------------------------
    // PHOTO
    // --------------------------------------------------

    document
      .getElementById("photoButton")
      .addEventListener(
        "click",
        () => {

          photoInput.click();

        }
      );


    photoInput.addEventListener(
      "change",
      event => {

        const file =
          event.target.files[0];

        if (!file) {
          return;
        }

        const reader =
          new FileReader();

        reader.onload =
          function(e) {

            const img =
              new Image();

            img.onload =
              function() {

                originalPhoto = img;

                currentPhoto = img;

                drawPhoto(
                  originalPhoto
                );

                photoTools.style.display =
                  "flex";

              };

            img.src =
              e.target.result;

          };

        reader.readAsDataURL(file);

      }
    );


    function drawPhoto(img) {

      if (!img) {
        return;
      }

      ctx.fillStyle =
        "white";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      const scale =
        Math.min(
          canvas.width / img.width,
          canvas.height / img.height
        );


      const width =
        img.width * scale;

      const height =
        img.height * scale;


      const x =
        (canvas.width - width) / 2;

      const y =
        (canvas.height - height) / 2;


      ctx.drawImage(
        img,
        x,
        y,
        width,
        height
      );

      setupBrush();

    }


    // Original
    document
      .getElementById("originalButton")
      .addEventListener(
        "click",
        () => {

          currentPhoto =
            originalPhoto;

          drawPhoto(
            originalPhoto
          );

        }
      );


    // Foto -> Zeichnung
    document
      .getElementById("drawingButton")
      .addEventListener(
        "click",
        () => {

          if (!originalPhoto) {
            return;
          }

          convertPhotoToDrawing(
            originalPhoto
          );

        }
      );


    function convertPhotoToDrawing(img) {

      const temp =
        document.createElement("canvas");

      temp.width =
        canvas.width;

      temp.height =
        canvas.height;

      const tempCtx =
        temp.getContext("2d");


      const scale =
        Math.min(
          canvas.width / img.width,
          canvas.height / img.height
        );


      const width =
        img.width * scale;

      const height =
        img.height * scale;


      const x =
        (canvas.width - width) / 2;

      const y =
        (canvas.height - height) / 2;


      tempCtx.drawImage(
        img,
        x,
        y,
        width,
        height
      );


      const imageData =
        tempCtx.getImageData(
          0,
          0,
          canvas.width,
          canvas.height
        );


      const data =
        imageData.data;


      // Schwarz-weiss + Kontrast
      for (
        let i = 0;
        i < data.length;
        i += 4
      ) {

        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const brightness =
          0.299 * r +
          0.587 * g +
          0.114 * b;


        let value;

        if (brightness < 95) {
          value = 0;
        } else if (brightness < 150) {
          value = 90;
        } else if (brightness < 205) {
          value = 190;
        } else {
          value = 255;
        }


        data[i] = value;
        data[i + 1] = value;
        data[i + 2] = value;

      }


      tempCtx.putImageData(
        imageData,
        0,
        0
      );


      ctx.fillStyle =
        "white";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      ctx.drawImage(
        temp,
        0,
        0
      );


      setupBrush();

      currentPhoto =
        temp;

    }


    // Foto löschen
    document
      .getElementById("removePhotoButton")
      .addEventListener(
        "click",
        () => {

          originalPhoto = null;

          currentPhoto = null;

          photoInput.value = "";

          photoTools.style.display =
            "none";

          ctx.fillStyle =
            "white";

          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          setupBrush();

        }
      );


    // --------------------------------------------------
    // CLEAR
    // --------------------------------------------------

    document
      .getElementById("clearButton")
      .addEventListener(
        "click",
        () => {

          ctx.fillStyle =
            "white";

          ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

          setupBrush();

          textInput.style.display =
            "none";

          textInput.value = "";

          originalPhoto = null;
          currentPhoto = null;

          photoInput.value = "";

          photoTools.style.display =
            "none";

          document
            .getElementById("sendMessage")
            .style.display =
            "none";

        }
      );


    // --------------------------------------------------
    // SENDEN – bleibt wie bisher
    // --------------------------------------------------

    document
      .getElementById("sendButton")
      .addEventListener(
        "click",
        async () => {

          const image =
            canvas.toDataURL(
              "image/png"
            );

          try {

            const response =
              await fetch(
                "https://bskeguuxbpoejhxbipmg.supabase.co/functions/v1/send-fax",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    sender: "zoe",
                    receiver: "manu",
                    image: image
                  })
                }
              );


            if (!response.ok) {

              throw new Error(
                "Senden fehlgeschlagen"
              );

            }


            document
              .getElementById("sendMessage")
              .style.display =
              "block";


          } catch (error) {

            alert(
              "Das Fax konnte nicht gesendet werden."
            );

            console.error(
              error
            );

          }

        }
      );

  </script>

</body>
</html>
