<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faxerl</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f3ed;
      color: #302d2b;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .faxerl {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .names {
      font-size: 16px;
      margin-bottom: 18px;
      opacity: 0.75;
    }

    .kaomoji {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .paper {
      width: 100%;
      background: white;
      border: 2px solid #302d2b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 4px 4px 0 #302d2b;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 360px;
      touch-action: none;
      cursor: crosshair;
    }

    .tools {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
    }

    .tools button,
    .tools select {
      border: 2px solid #302d2b;
      background: white;
      color: #302d2b;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 2px 2px 0 #302d2b;
    }

    .tools button.active {
      background: #302d2b;
      color: white;
    }

    .tools select {
      appearance: auto;
    }

    .size-dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: currentColor;
      border-radius: 50%;
      vertical-align: middle;
    }

    .size-dot.medium {
      width: 9px;
      height: 9px;
    }

    .size-dot.large {
      width: 14px;
      height: 14px;
    }

    .size-dot.xlarge {
      width: 19px;
      height: 19px;
    }

    .size-dot.xxlarge {
      width: 25px;
      height: 25px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      border: 2px solid #302d2b;
      background: white;
      color: #302d2b;
      border-radius: 6px;
      padding: 12px 22px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #302d2b;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #302d2b;
    }

    #sendMessage {
      display: none;
      margin-top: 20px;
      font-size: 25px;
    }

    .text-input {
      position: absolute;
      display: none;
      border: 2px dashed #302d2b;
      background: rgba(255,255,255,0.95);
      color: #302d2b;
      outline: none;
      font-size: 20px;
      font-family: Arial, Helvetica, sans-serif;
      padding: 3px 5px;
      min-width: 120px;
      max-width: 90%;
      z-index: 5;
    }
  </style>
</head>

<body>

  <main class="faxerl">

    <h1>📠 faxerl</h1>

    <div class="names">Zoë → Manu</div>

    <div class="kaomoji">❤ (ɔˆз(ˆ⌣ˆc)</div>

    <div class="paper">
      <canvas id="canvas"></canvas>

      <input
        id="textInput"
        class="text-input"
        type="text"
        autocomplete="off"
        placeholder="Text..."
      >
    </div>

    <div class="tools">

      <button id="brushButton" class="active">
        ✎
      </button>

      <button class="sizeButton active" data-size="2">
        <span class="size-dot"></span>
      </button>

      <button class="sizeButton" data-size="4">
        <span class="size-dot medium"></span>
      </button>

      <button class="sizeButton" data-size="7">
        <span class="size-dot large"></span>
      </button>

      <button class="sizeButton" data-size="12">
        <span class="size-dot xlarge"></span>
      </button>

      <button class="sizeButton" data-size="20">
        <span class="size-dot xxlarge"></span>
      </button>

      <button id="textButton">
        T
      </button>

      <button id="boldButton">
        B
      </button>

      <select id="fontSelect">
        <option value="Arial">Arial</option>
        <option value="Courier New">Courier New</option>
        <option value="Comic Sans MS">Comic Sans MS</option>
        <option value="Bangers">Comic</option>
      </select>

      <select id="fontSizeSelect">
        <option value="16">16</option>
        <option value="20" selected>20</option>
        <option value="26">26</option>
        <option value="34">34</option>
      </select>

    </div>

    <div class="buttons">
      <button id="clearButton">löschen</button>
      <button id="sendButton">senden</button>
    </div>

    <div id="sendMessage">
      ٩(◕‿◕｡)۶
    </div>

  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const textInput = document.getElementById("textInput");

    let drawing = false;
    let textMode = false;
    let textX = 0;
    let textY = 0;
    let brushSize = 2;
    let boldText = false;
    let selectedFont = "Arial";
    let selectedFontSize = 20;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();

      const oldCanvas = document.createElement("canvas");
      oldCanvas.width = canvas.width;
      oldCanvas.height = canvas.height;

      if (canvas.width && canvas.height) {
        oldCanvas.getContext("2d").drawImage(canvas, 0, 0);
      }

      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (oldCanvas.width && oldCanvas.height) {
        ctx.drawImage(
          oldCanvas,
          0,
          0,
          oldCanvas.width,
          oldCanvas.height,
          0,
          0,
          canvas.width,
          canvas.height
        );
      }

      setupBrush();
    }

    function setupBrush() {
      ctx.strokeStyle = "#302d2b";
      ctx.lineWidth = brushSize;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function getPosition(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    // Zeichnen
    canvas.addEventListener("pointerdown", (event) => {

      if (textMode) {
        const position = getPosition(event);

        textX = position.x;
        textY = position.y;

        textInput.style.left = textX + "px";
        textInput.style.top = textY + "px";
        textInput.style.display = "block";

        textInput.style.fontFamily = selectedFont;
        textInput.style.fontSize = selectedFontSize + "px";
        textInput.style.fontWeight = boldText ? "bold" : "normal";

        textInput.value = "";
        textInput.focus();

        return;
      }

      drawing = true;

      const position = getPosition(event);

      ctx.beginPath();
      ctx.moveTo(position.x, position.y);

      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!drawing || textMode) return;

      const position = getPosition(event);

      ctx.lineTo(position.x, position.y);
      ctx.stroke();
    });

    canvas.addEventListener("pointerup", () => {
      drawing = false;
      ctx.closePath();
    });

    canvas.addEventListener("pointercancel", () => {
      drawing = false;
      ctx.closePath();
    });

    // Pinsel
    document.getElementById("brushButton").addEventListener("click", () => {

      textMode = false;

      document.getElementById("brushButton").classList.add("active");
      document.getElementById("textButton").classList.remove("active");

      textInput.style.display = "none";

      canvas.style.cursor = "crosshair";
    });

    // Pinselgrössen
    document.querySelectorAll(".sizeButton").forEach(button => {

      button.addEventListener("click", () => {

        document.querySelectorAll(".sizeButton").forEach(b => {
          b.classList.remove("active");
        });

        button.classList.add("active");

        brushSize = Number(button.dataset.size);

        setupBrush();

        textMode = false;

        document.getElementById("brushButton").classList.add("active");
        document.getElementById("textButton").classList.remove("active");

        textInput.style.display = "none";

        canvas.style.cursor = "crosshair";
      });

    });

    // Textmodus
    document.getElementById("textButton").addEventListener("click", () => {

      textMode = true;

      document.getElementById("textButton").classList.add("active");
      document.getElementById("brushButton").classList.remove("active");

      textInput.style.display = "none";

      canvas.style.cursor = "text";
    });

    // Fett
    document.getElementById("boldButton").addEventListener("click", () => {

      boldText = !boldText;

      document.getElementById("boldButton").classList.toggle(
        "active",
        boldText
      );

      textInput.style.fontWeight = boldText ? "bold" : "normal";
    });

    // Schriftart
    document.getElementById("fontSelect").addEventListener("change", (event) => {

      selectedFont = event.target.value;

      textInput.style.fontFamily = selectedFont;
    });

    // Schriftgrösse
    document.getElementById("fontSizeSelect").addEventListener("change", (event) => {

      selectedFontSize = Number(event.target.value);

      textInput.style.fontSize = selectedFontSize + "px";
    });

    // Text auf Canvas schreiben
    textInput.addEventListener("keydown", (event) => {

      if (event.key === "Enter") {

        const text = textInput.value.trim();

        if (text) {

          ctx.fillStyle = "#302d2b";

          const weight = boldText ? "bold" : "normal";

          ctx.font =
            weight + " " +
            selectedFontSize + "px " +
            '"' + selectedFont + '"';

          ctx.textBaseline = "top";

          ctx.fillText(text, textX, textY);
        }

        textInput.style.display = "none";
        textInput.value = "";
      }

      if (event.key === "Escape") {

        textInput.style.display = "none";
        textInput.value = "";
      }
    });

    // Löschen
    document.getElementById("clearButton").addEventListener("click", () => {

      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      setupBrush();

      textInput.style.display = "none";
      textInput.value = "";

      document.getElementById("sendMessage").style.display = "none";
    });

    // SENDEN – unverändert
    document.getElementById("sendButton").addEventListener("click", async () => {

      const image = canvas.toDataURL("image/png");

      try {

        const response = await fetch(
          "https://bskeguuxbpoejhxbipmg.supabase.co/functions/v1/send-fax",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              sender: "zoe",
              receiver: "manu",
              image: image
            })
          }
        );

        if (!response.ok) {
          throw new Error("Senden fehlgeschlagen");
        }

        document.getElementById("sendMessage").style.display = "block";

      } catch (error) {

        alert("Das Fax konnte nicht gesendet werden.");

        console.error(error);

      }

    });
  </script>

</body>
</html>
