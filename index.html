<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FAXERL</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      margin: 0;
      background: #263B52;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 24px 0 4px;
      font-size: 42px;
      letter-spacing: 3px;
    }

    .kaomoji {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .participants {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin: 10px auto;
      max-width: 700px;
    }

    button,
    select {
      border: 2px solid white;
      background: #263B52;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button {
      font-weight: bold;
    }

    button:hover,
    select:hover {
      background: #3a526d;
    }

    button.active {
      background: white;
      color: #263B52;
    }

    .brush {
      min-width: 42px;
      font-weight: normal;
    }

    #canvas {
      display: block;
      margin: 15px auto;
      background: white;
      border: 3px solid white;
      border-radius: 10px;
      width: min(92vw, 700px);
      height: 500px;
      touch-action: none;
      cursor: crosshair;
    }

    .bottom {
      margin: 15px 0 30px;
    }

    #photoInput {
      display: none;
    }

    #sendButton {
      padding-left: 20px;
      padding-right: 20px;
    }
  </style>
</head>

<body>

  <h1>FAXERL</h1>

  <div class="kaomoji">
    &lt;3 (ɔˆз(ˆ⌣ˆc)
  </div>

  <div class="participants">
    Zoë ↔ Manu
  </div>

  <!-- Hauptwerkzeuge -->
  <div class="toolbar">

    <button id="penButton" class="active">
      Stifterl
    </button>

    <button id="eraserButton">
      Schwammerl
    </button>

    <!-- 3 Punktgrössen -->
    <button class="brush active" data-size="2">•</button>
    <button class="brush" data-size="6">●</button>
    <button class="brush" data-size="12">⬤</button>

    <!-- Text -->
    <button id="textButton">
      T
    </button>

    <!-- Fett -->
    <button id="boldButton">
      <b>B</b>
    </button>

    <!-- Schrift -->
    <select id="fontSelect">
      <option value="Arial">Arial</option>
      <option value="Courier New">Courier New</option>
      <option value="Comic Sans MS">Comic Sans MS</option>
      <option value="Bangers">Comic</option>
    </select>

    <!-- Schriftgrösse -->
    <select id="fontSize">
      <option value="16">16</option>
      <option value="20" selected>20</option>
      <option value="26">26</option>
      <option value="34">34</option>
    </select>

    <!-- Foto -->
    <button id="photoButton">
      Pföteli
    </button>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

  </div>

  <!-- Foto-Werkzeuge -->
  <div
    class="toolbar"
    id="photoTools"
    style="display:none;"
  >
    <button id="photoOriginal">
      Original
    </button>

    <button id="photoDrawing">
      Zeichnung
    </button>

    <button id="photoDelete">
      Foto löschen
    </button>
  </div>

  <!-- Zeichenfläche -->
  <canvas
    id="canvas"
    width="700"
    height="500"
  ></canvas>

  <!-- Unten -->
  <div class="bottom">

    <button id="clearButton">
      löschen
    </button>

    <button id="sendButton">
      senden
    </button>

  </div>


  <script>

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const penButton =
      document.getElementById("penButton");

    const eraserButton =
      document.getElementById("eraserButton");

    const textButton =
      document.getElementById("textButton");

    const boldButton =
      document.getElementById("boldButton");

    const fontSelect =
      document.getElementById("fontSelect");

    const fontSize =
      document.getElementById("fontSize");

    const clearButton =
      document.getElementById("clearButton");

    const sendButton =
      document.getElementById("sendButton");

    const photoButton =
      document.getElementById("photoButton");

    const photoInput =
      document.getElementById("photoInput");

    const photoTools =
      document.getElementById("photoTools");

    const photoOriginal =
      document.getElementById("photoOriginal");

    const photoDrawing =
      document.getElementById("photoDrawing");

    const photoDelete =
      document.getElementById("photoDelete");


    let drawing = false;
    let mode = "pen";
    let brushSize = 2;
    let textMode = false;
    let bold = false;

    let photo = null;
    let photoIsDrawing = false;


    // Canvas am Anfang weiss
    ctx.fillStyle = "white";
    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    // Position auf dem Canvas bestimmen
    function getPosition(e) {

      const rect =
        canvas.getBoundingClientRect();

      return {
        x:
          (e.clientX - rect.left) *
          (canvas.width / rect.width),

        y:
          (e.clientY - rect.top) *
          (canvas.height / rect.height)
      };
    }


    // Zeichnen starten
    function startDrawing(e) {

      const pos = getPosition(e);

      // Textmodus
      if (textMode) {
        addText(pos.x, pos.y);
        return;
      }

      drawing = true;

      ctx.beginPath();

      ctx.moveTo(
        pos.x,
        pos.y
      );
    }


    // Zeichnen
    function draw(e) {

      if (!drawing || textMode) {
        return;
      }

      const pos = getPosition(e);

      ctx.lineWidth = brushSize;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";


      if (mode === "eraser") {

        // Radieren
        ctx.globalCompositeOperation =
          "destination-out";

      } else {

        // Stift
        ctx.globalCompositeOperation =
          "source-over";

        ctx.strokeStyle = "#111";
      }


      ctx.lineTo(
        pos.x,
        pos.y
      );

      ctx.stroke();


      ctx.beginPath();

      ctx.moveTo(
        pos.x,
        pos.y
      );


      ctx.globalCompositeOperation =
        "source-over";
    }


    function stopDrawing() {

      drawing = false;

      ctx.beginPath();
    }


    // Maus + Touch / Stift
    canvas.addEventListener(
      "pointerdown",
      startDrawing
    );

    canvas.addEventListener(
      "pointermove",
      draw
    );

    canvas.addEventListener(
      "pointerup",
      stopDrawing
    );

    canvas.addEventListener(
      "pointercancel",
      stopDrawing
    );

    canvas.addEventListener(
      "pointerleave",
      stopDrawing
    );


    // STIFTERL
    penButton.addEventListener(
      "click",
      () => {

        mode = "pen";

        penButton.classList.add(
          "active"
        );

        eraserButton.classList.remove(
          "active"
        );

        textMode = false;

        textButton.classList.remove(
          "active"
        );

        canvas.style.cursor =
          "crosshair";
      }
    );


    // SCHWAMMERL
    eraserButton.addEventListener(
      "click",
      () => {

        mode = "eraser";

        eraserButton.classList.add(
          "active"
        );

        penButton.classList.remove(
          "active"
        );

        textMode = false;

        textButton.classList.remove(
          "active"
        );

        canvas.style.cursor =
          "cell";
      }
    );


    // 3 Punktgrössen
    document
      .querySelectorAll(".brush")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            brushSize =
              Number(
                button.dataset.size
              );

            document
              .querySelectorAll(".brush")
              .forEach(b =>
                b.classList.remove(
                  "active"
                )
              );

            button.classList.add(
              "active"
            );

            mode = "pen";

            penButton.classList.add(
              "active"
            );

            eraserButton.classList.remove(
              "active"
            );
          }
        );

      });


    // TEXT
    textButton.addEventListener(
      "click",
      () => {

        textMode = !textMode;

        textButton.classList.toggle(
          "active",
          textMode
        );


        if (textMode) {

          mode = "pen";

          penButton.classList.add(
            "active"
          );

          eraserButton.classList.remove(
            "active"
          );

          canvas.style.cursor =
            "text";

        } else {

          canvas.style.cursor =
            "crosshair";
        }

      }
    );


    // FETT
    boldButton.addEventListener(
      "click",
      () => {

        bold = !bold;

        boldButton.classList.toggle(
          "active",
          bold
        );

      }
    );


    // Text hinzufügen
    function addText(x, y) {

      const text =
        prompt("Text eingeben:");

      if (!text) {
        return;
      }

      const size =
        Number(fontSize.value);

      const font =
        fontSelect.value;


      ctx.globalCompositeOperation =
        "source-over";

      ctx.fillStyle = "#111";

      ctx.font =
        `${bold ? "bold " : ""}${size}px "${font}"`;

      ctx.textBaseline = "top";

      ctx.fillText(
        text,
        x,
        y
      );
    }


    // PFÖTELI / Foto
    photoButton.addEventListener(
      "click",
      () => {

        photoInput.click();
      }
    );


    photoInput.addEventListener(
      "change",
      e => {

        const file =
          e.target.files[0];

        if (!file) {
          return;
        }


        const reader =
          new FileReader();


        reader.onload =
          event => {

            const img =
              new Image();


            img.onload =
              () => {

                photo = img;

                photoIsDrawing =
                  false;

                photoTools.style.display =
                  "flex";

                drawPhoto();
              };


            img.src =
              event.target.result;
          };


        reader.readAsDataURL(file);
      }
    );


    // Foto zeichnen
    function drawPhoto() {

      if (!photo) {
        return;
      }


      ctx.globalCompositeOperation =
        "source-over";

      ctx.fillStyle = "white";

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      const scale =
        Math.min(
          canvas.width / photo.width,
          canvas.height / photo.height
        );


      const width =
        photo.width * scale;

      const height =
        photo.height * scale;


      const x =
        (canvas.width - width) / 2;

      const y =
        (canvas.height - height) / 2;


      if (!photoIsDrawing) {

        ctx.drawImage(
          photo,
          x,
          y,
          width,
          height
        );

      } else {

        // Foto als Zeichnung
        const temp =
          document.createElement(
            "canvas"
          );

        temp.width =
          photo.width;

        temp.height =
          photo.height;


        const tempCtx =
          temp.getContext("2d");


        tempCtx.drawImage(
          photo,
          0,
          0
        );


        const imageData =
          tempCtx.getImageData(
            0,
            0,
            temp.width,
            temp.height
          );


        const data =
          imageData.data;


        for (
          let i = 0;
          i < data.length;
          i += 4
        ) {

          const gray =
            0.299 * data[i] +
            0.587 * data[i + 1] +
            0.114 * data[i + 2];


          const value =
            gray > 150
              ? 255
              : 0;


          data[i] =
            value;

          data[i + 1] =
            value;

          data[i + 2] =
            value;
        }


        tempCtx.putImageData(
          imageData,
          0,
          0
        );


        ctx.drawImage(
          temp,
          x,
          y,
          width,
          height
        );
      }
    }


    // Original
    photoOriginal.addEventListener(
      "click",
      () => {

        photoIsDrawing =
          false;

        drawPhoto();
      }
    );


    // Zeichnung
    photoDrawing.addEventListener(
      "click",
      () => {

        photoIsDrawing =
          true;

        drawPhoto();
      }
    );


    // Foto löschen
    photoDelete.addEventListener(
      "click",
      () => {

        photo = null;

        photoIsDrawing =
          false;

        photoTools.style.display =
          "none";

        photoInput.value =
          "";


        ctx.globalCompositeOperation =
          "source-over";

        ctx.fillStyle =
          "white";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );
      }
    );


    // Alles löschen
    clearButton.addEventListener(
      "click",
      () => {

        photo = null;

        photoIsDrawing =
          false;

        photoTools.style.display =
          "none";

        photoInput.value =
          "";


        ctx.globalCompositeOperation =
          "source-over";

        ctx.fillStyle =
          "white";

        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );
      }
    );


    // SENDEN
    sendButton.addEventListener(
      "click",
      async () => {

        const image =
          canvas.toDataURL(
            "image/png"
          );


        sendButton.disabled =
          true;

        sendButton.textContent =
          "wird gesendet…";


        try {

          const response =
            await fetch(
              "https://bskeguuxbpoejhxbipmg.supabase.co/functions/v1/send-fax",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    sender: "zoe",
                    receiver: "manu",
                    image: image
                  })
              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            throw new Error(
              result.error ||
              "Fehler beim Senden"
            );
          }


          sendButton.textContent =
            "٩(◕‿◕｡)۶";


          setTimeout(
            () => {

              sendButton.textContent =
                "senden";

              sendButton.disabled =
                false;

            },
            2000
          );


        } catch (error) {

          console.error(error);

          alert(
            "Das Senden hat nicht funktioniert."
          );


          sendButton.textContent =
            "senden";

          sendButton.disabled =
            false;
        }

      }
    );

  </script>

</body>
</html>
