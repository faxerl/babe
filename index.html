<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faxerl</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f3ed;
      color: #302d2b;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .faxerl {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .names {
      font-size: 16px;
      margin-bottom: 18px;
      opacity: 0.75;
    }

    .kaomoji {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .paper {
      width: 100%;
      background: white;
      border: 2px solid #302d2b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 4px 4px 0 #302d2b;
    }

    canvas {
      display: block;
      width: 100%;
      height: 360px;
      touch-action: none;
      cursor: crosshair;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      border: 2px solid #302d2b;
      background: white;
      color: #302d2b;
      border-radius: 6px;
      padding: 12px 22px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 3px 3px 0 #302d2b;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #302d2b;
    }

    #sendMessage {
      display: none;
      margin-top: 20px;
      font-size: 25px;
    }
  </style>
</head>

<body>

  <main class="faxerl">

    <h1>📠 faxerl</h1>

    <div class="names">Zoë → Manu</div>

    <div class="kaomoji">❤ (ɔˆз(ˆ⌣ˆc)</div>

    <div class="paper">
      <canvas id="canvas"></canvas>
    </div>

    <div class="buttons">
      <button id="clearButton">löschen</button>
      <button id="sendButton">senden</button>
    </div>

    <div id="sendMessage">
      ٩(◕‿◕｡)۶
    </div>

  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();

      canvas.width = rect.width;
      canvas.height = rect.height;

      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#302d2b";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    let drawing = false;

    function getPosition(event) {
      const rect = canvas.getBoundingClientRect();

      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    canvas.addEventListener("pointerdown", (event) => {
      drawing = true;

      const position = getPosition(event);

      ctx.beginPath();
      ctx.moveTo(position.x, position.y);

      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!drawing) return;

      const position = getPosition(event);

      ctx.lineTo(position.x, position.y);
      ctx.stroke();
    });

    canvas.addEventListener("pointerup", () => {
      drawing = false;
      ctx.closePath();
    });

    canvas.addEventListener("pointercancel", () => {
      drawing = false;
      ctx.closePath();
    });

    document.getElementById("clearButton").addEventListener("click", () => {
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#302d2b";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      document.getElementById("sendMessage").style.display = "none";
    });

    document.getElementById("sendButton").addEventListener("click", async () => {

      const image = canvas.toDataURL("image/png");

      try {

        const response = await fetch(
          "https://bskeguuxbpoejhxbipmg.supabase.co/functions/v1/send-fax",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              sender: "zoe",
              receiver: "manu",
              image: image
            })
          }
        );

        if (!response.ok) {
          throw new Error("Senden fehlgeschlagen");
        }

        document.getElementById("sendMessage").style.display = "block";

      } catch (error) {

        alert("Das Fax konnte nicht gesendet werden.");

        console.error(error);

      }

    });
  </script>

</body>
</html>
